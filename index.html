<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NikitaNews Editor | Beta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #070d15;
        --bg-soft: #0d1723;
        --panel: rgba(20, 29, 39, 0.82);
        --panel-strong: rgba(15, 22, 30, 0.96);
        --line: rgba(169, 191, 218, 0.12);
        --text: #edf5ff;
        --muted: #aec5d8;
        --soft: #dfe9f6;
        --primary: #75b9ff;
        --primary-2: #8d78ff;
        --success: #5eead4;
        --warning: #fbbf24;
        --danger: #f87171;
        --shadow: 0 30px 70px rgba(0, 0, 0, 0.38);
      }

      * { box-sizing: border-box; }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Inter", sans-serif;
        background:
          radial-gradient(circle at 15% 20%, rgba(123, 117, 255, 0.18), transparent 20%),
          radial-gradient(circle at 75% 15%, rgba(110, 221, 175, 0.12), transparent 28%),
          radial-gradient(circle at 85% 78%, rgba(245, 162, 96, 0.12), transparent 26%),
          linear-gradient(180deg, #050b12 0%, var(--bg) 100%);
        color: var(--text);
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        border-radius: 50%;
        filter: blur(18px);
        opacity: 0.6;
        pointer-events: none;
      }

      body::before {
        width: 280px;
        height: 280px;
        right: 7%;
        bottom: 6%;
        background: rgba(126, 111, 91, 0.28);
        animation: drift 16s ease-in-out infinite alternate;
      }

      body::after {
        width: 260px;
        height: 260px;
        left: 6%;
        bottom: 8%;
        background: rgba(93, 143, 106, 0.18);
        animation: drift 18s ease-in-out infinite alternate-reverse;
      }

      @keyframes drift {
        0% { transform: translate3d(0, 0, 0) scale(1); }
        100% { transform: translate3d(30px, -18px, 0) scale(1.08); }
      }

      button, input, select, textarea {
        font: inherit;
      }

      .page-shell {
        max-width: 1380px;
        margin: 0 auto;
        padding: 28px 22px 54px;
      }

      .hidden {
        display: none !important;
      }

      .auth-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 20% 20%, rgba(117, 185, 255, 0.2), transparent 22%),
          radial-gradient(circle at 75% 25%, rgba(141, 120, 255, 0.18), transparent 26%),
          linear-gradient(180deg, #070d15 0%, #0a111b 100%);
      }

      .auth-card {
        width: min(420px, 100%);
        background: rgba(13, 21, 30, 0.9);
        border: 1px solid var(--line);
        border-radius: 26px;
        box-shadow: var(--shadow);
        padding: 28px 24px 22px;
      }

      .auth-card h2 {
        margin: 0 0 10px;
        font-size: 2rem;
        letter-spacing: -0.04em;
      }

      .auth-subtitle {
        margin: 0 0 20px;
        color: var(--muted);
      }

      .auth-form {
        display: grid;
        gap: 16px;
      }

      .auth-form input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(8, 13, 20, 0.86);
        color: var(--text);
        padding: 12px 14px;
        outline: none;
      }

      .auth-form button {
        border: none;
        border-radius: 14px;
        padding: 13px 18px;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: white;
        font-weight: 800;
        cursor: pointer;
      }

      .auth-error {
        min-height: 20px;
        margin-top: 12px;
        color: #ff9ea5;
        font-size: 0.88rem;
      }

      .logout-button {
        border: 1px solid rgba(160, 178, 198, 0.2);
        background: rgba(148, 163, 184, 0.08);
        color: var(--text);
        border-radius: 12px;
        padding: 9px 12px;
        cursor: pointer;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 22px;
      }

      .toolbar-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .action-button {
        border: 1px solid rgba(160, 178, 198, 0.2);
        background: rgba(148, 163, 184, 0.08);
        color: var(--text);
        border-radius: 12px;
        padding: 10px 14px;
        cursor: pointer;
        font-weight: 700;
        transition: transform 0.2s ease, border-color 0.2s ease;
      }

      .action-button.primary {
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: white;
        border: none;
        box-shadow: 0 18px 38px rgba(117, 185, 255, 0.25);
      }

      .action-button:hover {
        transform: translateY(-1px);
        border-color: rgba(117, 185, 255, 0.35);
      }

      .eyebrow {
        margin: 0 0 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: 11px;
        font-weight: 700;
        color: var(--primary);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 3vw, 3rem);
        letter-spacing: -0.04em;
      }

      .status-pill {
        min-width: 112px;
        text-align: center;
        padding: 10px 16px;
        border-radius: 999px;
        font-weight: 700;
        color: var(--soft);
        background: rgba(125, 158, 194, 0.08);
        border: 1px solid rgba(125, 158, 194, 0.22);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(360px, 1.1fr) minmax(350px, 0.9fr);
        gap: 26px;
      }

      .panel {
        background: linear-gradient(180deg, rgba(16, 25, 35, 0.92), rgba(10, 16, 23, 0.96));
        border: 1px solid var(--line);
        border-radius: 26px;
        box-shadow: var(--shadow);
        overflow: hidden;
        backdrop-filter: blur(12px);
        animation: panelFloat 0.7s ease both;
      }

      @keyframes panelFloat {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 22px 16px;
        border-bottom: 1px solid var(--line);
      }

      .panel-header h2 {
        margin: 0;
        font-size: 1.2rem;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 80px;
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .badge-info {
        background: rgba(117, 129, 255, 0.12);
        border: 1px solid rgba(117, 129, 255, 0.25);
        color: #d7d3ff;
      }

      .editor-form {
        display: grid;
        gap: 18px;
        padding: 20px 22px 26px;
      }

      .field-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      label {
        display: grid;
        gap: 8px;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .full-width {
        grid-column: 1 / -1;
      }

      input, select, textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(8, 13, 20, 0.86);
        color: var(--text);
        padding: 12px 14px;
        outline: none;
        transition: border-color 0.22s ease, box-shadow 0.22s ease, transform 0.22s ease;
      }

      input::placeholder, textarea::placeholder {
        color: rgba(187, 204, 222, 0.55);
      }

      input:focus, select:focus, textarea:focus {
        border-color: rgba(117, 185, 255, 0.7);
        box-shadow: 0 0 0 4px rgba(117, 185, 255, 0.12);
        transform: translateY(-1px);
      }

      textarea {
        min-height: 170px;
        resize: vertical;
      }

      .button-row {
        display: flex;
        justify-content: flex-start;
      }

      .format-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 0 2px 12px;
      }

      .format-button {
        border: 1px solid rgba(160, 178, 198, 0.2);
        background: rgba(148, 163, 184, 0.08);
        color: var(--text);
        border-radius: 10px;
        padding: 8px 10px;
        cursor: pointer;
        font-weight: 700;
        transition: transform 0.2s ease, border-color 0.2s ease;
      }

      .format-button:hover {
        transform: translateY(-1px);
        border-color: rgba(117, 185, 255, 0.35);
      }

      .primary-button {
        border: none;
        border-radius: 14px;
        padding: 13px 18px;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: white;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 18px 38px rgba(117, 185, 255, 0.25);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .primary-button:hover {
        transform: translateY(-2px) scale(1.01);
        box-shadow: 0 24px 42px rgba(117, 185, 255, 0.32);
      }

      .topbar {
        animation: fadeSlide 0.6s ease both;
      }

      @keyframes fadeSlide {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .chip, .status-pill, .badge {
        transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .chip:hover, .status-pill:hover, .badge:hover {
        transform: translateY(-1px);
        border-color: rgba(117, 185, 255, 0.4);
      }

      .post-card {
        transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
      }

      .post-card:hover {
        transform: translateY(-2px);
        border-color: rgba(117, 185, 255, 0.32);
        box-shadow: 0 20px 36px rgba(0, 0, 0, 0.18);
      }

      .post-list {
        display: grid;
        gap: 16px;
        padding: 20px 22px 24px;
      }

      .post-card {
        position: relative;
        padding: 18px 18px 14px;
        border-radius: 18px;
        border: 1px solid var(--line);
        background: linear-gradient(180deg, rgba(18, 28, 38, 0.9), rgba(11, 18, 25, 0.96));
        overflow: hidden;
        animation: fadeUp 0.4s ease both;
      }

      .post-card::before {
        content: "";
        position: absolute;
        inset: 0 auto auto 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, var(--primary), transparent);
        opacity: 0.7;
      }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .post-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(117, 185, 255, 0.12);
        border: 1px solid rgba(117, 185, 255, 0.24);
        color: #dfeeff;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .status {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .post-card h3 {
        margin: 0 0 6px;
        font-size: 1.2rem;
      }

      .subtitle {
        margin: 0 0 10px;
        color: #dfeaf8;
      }

      .meta {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 0.86rem;
      }

      .preview {
        margin: 0;
        line-height: 1.65;
        color: #eef4ff;
        white-space: pre-wrap;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }

      .mini-button {
        border: 1px solid rgba(160, 178, 198, 0.2);
        background: rgba(148, 163, 184, 0.08);
        color: var(--text);
        border-radius: 10px;
        padding: 8px 10px;
        cursor: pointer;
        transition: transform 0.2s ease, border-color 0.2s ease;
      }

      .mini-button:hover {
        transform: translateY(-1px);
        border-color: rgba(160, 178, 198, 0.34);
      }

      .mini-button.send {
        background: rgba(94, 234, 212, 0.08);
        border-color: rgba(94, 234, 212, 0.2);
        color: #d8fff9;
      }

      .mini-button.delete {
        background: rgba(248, 113, 113, 0.08);
        border-color: rgba(248, 113, 113, 0.2);
        color: #ffd6d6;
      }

      .empty-state {
        border: 1px dashed rgba(154, 176, 202, 0.25);
        border-radius: 18px;
        padding: 28px 18px;
        text-align: center;
        color: var(--muted);
        background: rgba(11, 17, 25, 0.38);
      }

      @media (max-width: 1024px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 640px) {
        .field-grid {
          grid-template-columns: 1fr;
        }

        .topbar {
          flex-direction: column;
          align-items: flex-start;
          gap: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div id="auth-screen" class="auth-screen">
      <div class="auth-card">
        <p class="eyebrow">RadactPanel</p>
        <h2>Вход в систему</h2>
        <p class="auth-subtitle">Введите данные для доступа к панели</p>

        <form id="login-form" class="auth-form">
          <input id="login-input" type="text" placeholder="Login" autocomplete="username" />
          <input id="password-input" type="password" placeholder="Password" autocomplete="current-password" />
          <button type="submit">Войти</button>
        </form>

        <div id="auth-error" class="auth-error"></div>
      </div>
    </div>

    <div id="app-shell" class="page-shell hidden">
      <section id="list-view">
        <header class="topbar">
          <div>
            <p class="eyebrow">NikitaNews</p>
            <h1>Редактор публикаций | Beta</h1>
          </div>

          <div class="toolbar-actions">
            <button type="button" id="new-post-button" class="action-button primary">+ New Post</button>
            <button type="button" id="refresh-posts-button" class="action-button">Обновить</button>
            <button type="button" id="logout-button" class="logout-button">Выйти</button>
            <div class="status-pill" id="post-count">0 постов</div>
          </div>
        </header>

        <div class="panel list-panel">
          <div class="panel-header">
            <h2>Посты</h2>
            <span class="badge badge-info">Очередь</span>
          </div>

          <div id="posts-list" class="post-list"></div>
        </div>
      </section>

      <section id="editor-view" class="hidden">
        <header class="topbar">
          <div class="toolbar-actions">
            <button type="button" id="back-to-list" class="action-button">← Назад</button>
            <div>
              <p class="eyebrow">Редактор</p>
              <h1 id="editor-title">Новый пост</h1>
            </div>
          </div>
        </header>

        <div class="panel editor-panel">
          <div class="panel-header">
            <h2 id="editor-panel-title">Создать пост</h2>
          </div>

          <form id="editor-form" class="editor-form">
            <div class="field-grid">
              <label>
                <span>Тип поста</span>
                <select id="type_name">
                  <option>Утренний</option>
                  <option>Вечерний</option>
                  <option>Итоги недели</option>
                  <option>Анонс</option>
                  <option>Новость</option>
                </select>
              </label>

              <label>
                <span>Дата отправки</span>
                <input id="send_date" type="date" />
              </label>

              <label>
                <span>Время отправки</span>
                <input id="send_time" type="time" />
              </label>

              <label class="full-width">
                <span>Чаты Telegram</span>
                <input id="chat_ids" type="text" placeholder="-1001234567890, -1009876543210" />
              </label>
            </div>

            <label>
              <span>Заголовок</span>
              <input id="title" type="text" placeholder="Например: Доброе утро, команда!" />
            </label>

            <label>
              <span>Подзаголовок</span>
              <input id="subtitle" type="text" placeholder="Краткое описание или лид" />
            </label>

            <label>
              <span>Содержимое</span>
              <div class="format-toolbar">
                <button type="button" class="format-button" data-tag="b">Жирный</button>
                <button type="button" class="format-button" data-tag="i">Курсив</button>
                <button type="button" class="format-button" data-tag="u">Подчерк.</button>
                <button type="button" class="format-button" data-tag="s">Зачерк.</button>
                <button type="button" class="format-button" data-tag="blockquote">Цитата</button>
                <button type="button" class="format-button" data-tag="code">Код</button>
                <button type="button" class="format-button" data-tag="link">Ссылка</button>
                <button type="button" class="format-button" data-tag="br">Новая строка</button>
              </div>
              <textarea id="content" rows="8" placeholder="Текст поста... Можно писать: <b>жирный</b>, <i>курсив</i>, <postlink:text=мой сайт;link=https://example.com>, <blockquote>цитата</blockquote>"></textarea>
            </label>

            <div class="button-row">
              <button type="submit" class="primary-button">Сохранить и поставить в очередь</button>
            </div>
          </form>
        </div>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const AUTH_LOGIN = 'RadactPanel';
      const AUTH_PASSWORD = 'RPP9918_REACT';
      const supabaseUrl = 'https://kujrguralvgilvzpfqhw.supabase.co';
      const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1anJndXJhbHZnaWx2enBmcWh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNDM4MDUsImV4cCI6MjEwNTkxOTgwNX0.wLAeEzUonCDaZU0ZSAVq9VPAAIg71pWvMUFOvszyPKo';
      const telegramBotToken = '8597992351:AAFom4BfG_rYXMjzntbiox3eKzViuOBDEAI';
      const supabaseClient = window.supabase ? window.supabase.createClient(supabaseUrl, supabaseKey) : null;

      const authScreen = document.getElementById('auth-screen');
      const appShell = document.getElementById('app-shell');
      const loginForm = document.getElementById('login-form');
      const loginInput = document.getElementById('login-input');
      const passwordInput = document.getElementById('password-input');
      const authError = document.getElementById('auth-error');
      const logoutButton = document.getElementById('logout-button');
      const newPostButton = document.getElementById('new-post-button');
      const refreshPostsButton = document.getElementById('refresh-posts-button');
      const backToListButton = document.getElementById('back-to-list');
      const listView = document.getElementById('list-view');
      const editorView = document.getElementById('editor-view');
      const editorTitle = document.getElementById('editor-title');
      const editorPanelTitle = document.getElementById('editor-panel-title');
      const postsList = document.getElementById('posts-list');
      const postCount = document.getElementById('post-count');
      let currentEditingId = null;

      function showListView() {
        listView.classList.remove('hidden');
        editorView.classList.add('hidden');
      }

      function showEditorView() {
        listView.classList.add('hidden');
        editorView.classList.remove('hidden');
      }

      function openNewPostEditor() {
        currentEditingId = null;
        editorTitle.textContent = 'Новый пост';
        editorPanelTitle.textContent = 'Создать пост';
        document.getElementById('editor-form').reset();
        document.getElementById('type_name').value = 'Утренний';
        showEditorView();
      }

      function openEditPostEditor(postId) {
        currentEditingId = postId;
        editorTitle.textContent = 'Редактировать пост';
        editorPanelTitle.textContent = 'Редактирование';
        showEditorView();

        const post = (window.__postsCache || []).find((item) => Number(item.id) === Number(postId));
        if (!post) return;

        document.getElementById('type_name').value = post.type_name || 'Утренний';
        document.getElementById('title').value = post.title || '';
        document.getElementById('subtitle').value = post.subtitle || '';
        document.getElementById('content').value = post.content || '';
        document.getElementById('chat_ids').value = post.chat_ids || '';

        if (post.scheduled_at) {
          document.getElementById('send_date').value = formatMoscowInputDate(post.scheduled_at);
          document.getElementById('send_time').value = formatMoscowInputTime(post.scheduled_at);
        }
      }

      function applyAuthState() {
        const isLogged = sessionStorage.getItem('radact-panel-auth') === 'true';
        authScreen.classList.toggle('hidden', isLogged);
        appShell.classList.toggle('hidden', !isLogged);

        if (isLogged) {
          loginInput.value = '';
          passwordInput.value = '';
          authError.textContent = '';
        }
      }

      function handleLogin(event) {
        event.preventDefault();

        const login = loginInput.value.trim();
        const password = passwordInput.value.trim();

        if (login === AUTH_LOGIN && password === AUTH_PASSWORD) {
          sessionStorage.setItem('radact-panel-auth', 'true');
          applyAuthState();
          return;
        }

        authError.textContent = 'Неверный логин или пароль';
        passwordInput.value = '';
      }

      function handleLogout() {
        sessionStorage.removeItem('radact-panel-auth');
        applyAuthState();
      }

      newPostButton.addEventListener('click', openNewPostEditor);
      refreshPostsButton.addEventListener('click', loadPosts);
      backToListButton.addEventListener('click', () => {
        showListView();
      });
      loginForm.addEventListener('submit', handleLogin);
      logoutButton.addEventListener('click', handleLogout);
      applyAuthState();
      showListView();

      function parseChatIds(raw) {
        return String(raw || '')
          .split(',')
          .map((value) => value.trim())
          .filter(Boolean);
      }

      function insertHtmlTag(tag, textarea) {
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const selected = textarea.value.slice(start, end) || 'текст';

        if (tag === 'br') {
          const value = textarea.value.slice(0, start) + '\n' + textarea.value.slice(end);
          textarea.value = value;
          textarea.focus();
          const cursorPos = start + 1;
          textarea.setSelectionRange(cursorPos, cursorPos);
          return;
        }

        if (tag === 'link') {
          const linkValue = selected || 'https://example.com';
          const result = `<a href="${linkValue}">${selected || 'ссылка'}</a>`;
          const value = textarea.value.slice(0, start) + result + textarea.value.slice(end);
          textarea.value = value;
          textarea.focus();
          const cursorPos = start + result.length;
          textarea.setSelectionRange(cursorPos, cursorPos);
          return;
        }

        const wrapper = tag === 'blockquote'
          ? '<blockquote>' + selected + '</blockquote>'
          : `<${tag}>${selected}</${tag}>`;

        const nextValue = textarea.value.slice(0, start) + wrapper + textarea.value.slice(end);
        textarea.value = nextValue;
        textarea.focus();

        const cursorPos = start + wrapper.length;
        textarea.setSelectionRange(cursorPos, cursorPos);
      }

      document.querySelectorAll('.format-button').forEach((button) => {
        button.addEventListener('click', () => {
          const textarea = document.getElementById('content');
          if (!textarea) return;
          insertHtmlTag(button.dataset.tag, textarea);
        });
      });

      const contentTextarea = document.getElementById('content');
      if (contentTextarea) {
        contentTextarea.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') {
            event.preventDefault();
            const start = contentTextarea.selectionStart;
            const end = contentTextarea.selectionEnd;
            const value = contentTextarea.value.slice(0, start) + '\n' + contentTextarea.value.slice(end);
            contentTextarea.value = value;
            contentTextarea.setSelectionRange(start + 1, start + 1);
          }
        });
      }

      function closeUnclosedTelegramTags(value) {
        let html = String(value || '');
        const allowedTags = ['b', 'strong', 'i', 'em', 'u', 's', 'del', 'blockquote', 'code', 'a'];

        for (const tag of allowedTags) {
          const startTagRegex = new RegExp(`<${tag}(?:\\s[^>]*)?>`, 'gi');
          const endTagRegex = new RegExp(`</${tag}>`, 'gi');
          const startCount = (html.match(startTagRegex) || []).length;
          const endCount = (html.match(endTagRegex) || []).length;

          if (startCount > endCount) {
            html += '</' + tag + '>'.repeat(startCount - endCount);
          }
        }

        return html;
      }

      function stripTelegramHtml(value) {
        return String(value || '')
          .replace(/<br\s*\/?>/gi, '\n')
          .replace(/<\/p>/gi, '\n')
          .replace(/<[^>]+>/g, '')
          .replace(/&nbsp;/gi, ' ')
          .replace(/&amp;/gi, '&')
          .replace(/&lt;/gi, '<')
          .replace(/&gt;/gi, '>')
          .replace(/\n{3,}/g, '\n\n')
          .trim();
      }

      function normalizeRichText(rawText) {
        if (!rawText) return '';

        let value = String(rawText)
          .replace(/\r\n/g, '\n')
          .replace(/\r/g, '\n');

        value = value.replace(/<br\s*\/?>/gi, '\n');

        value = value.replace(/<postlink:\s*text\s*=\s*([^;]+?)\s*;\s*link\s*=\s*([^>]+?)\s*>/gi, (_, text, url) => {
          const label = String(text).trim();
          const cleanUrl = String(url).trim();
          return `<a href="${cleanUrl}">${label || cleanUrl}</a>`;
        });

        value = value.replace(/<link:\s*=?\s*([^>]+)>/gi, (_, url) => {
          const cleanUrl = String(url).trim();
          return `<a href="${cleanUrl}">${cleanUrl}</a>`;
        });

        value = value.replace(/<(?!\/?(?:b|strong|i|em|u|s|del|blockquote|code|a)\b)[^>]+>/gi, '');
        value = closeUnclosedTelegramTags(value);
        return value;
      }

      function buildTelegramText(post) {
        const blocks = [];

        if (post.title) {
          blocks.push(post.title);
        }

        if (post.subtitle) {
          blocks.push(post.subtitle);
        }

        if (post.content) {
          blocks.push(normalizeRichText(post.content));
        }

        return blocks.join('\n\n');
      }

      function splitTelegramMessage(text) {
        const maxLength = 3000;
        const source = String(text || '').trim();

        if (!source) {
          return [];
        }

        if (source.length <= maxLength) {
          return [closeUnclosedTelegramTags(source)];
        }

        const chunks = [];
        let current = source;

        while (current.length > maxLength) {
          let cut = current.lastIndexOf(' ', maxLength);
          if (cut <= 0) {
            cut = maxLength;
          }

          let part = current.slice(0, cut).trim();
          if (!part) {
            break;
          }

          const openTagMatch = part.match(/<([a-z0-9]+)(?:\s[^>]*)?>$/i);
          const closeTagMatch = part.match(/<\/([a-z0-9]+)>$/i);

          if (openTagMatch && !closeTagMatch) {
            const tagName = openTagMatch[1].toLowerCase();
            const tagToClose = `</${tagName}>`;
            part = `${part}${tagToClose}`;
          }

          const plainText = part.replace(/<[^>]+>/g, '');
          if (!plainText.trim()) {
            const fallback = current.slice(0, Math.min(current.length, maxLength)).trim();
            chunks.push(closeUnclosedTelegramTags(fallback));
            current = current.slice(Math.min(current.length, maxLength)).trim();
            continue;
          }

          chunks.push(closeUnclosedTelegramTags(part));
          current = current.slice(cut).trim();
        }

        if (current.trim()) {
          chunks.push(closeUnclosedTelegramTags(current.trim()));
        }

        return chunks.filter(Boolean);
      }

      async function sendSingleTelegramChunk(chatId, messageText, preferHtml = true) {
        const rawBody = {
          chat_id: Number(chatId) || chatId,
          text: messageText,
          disable_web_page_preview: true,
        };

        if (preferHtml) {
          rawBody.parse_mode = 'HTML';
        }

        const response = await fetch(`https://api.telegram.org/bot${telegramBotToken}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(rawBody),
        });

        const result = await response.json();

        if (!response.ok || !result.ok) {
          return {
            ok: false,
            description: result.description || 'Telegram request failed',
          };
        }

        return { ok: true };
      }

      async function sendTelegramMessage(post) {
        if (!telegramBotToken || telegramBotToken === 'YOUR_TELEGRAM_BOT_TOKEN') {
          throw new Error('Не указан Telegram bot token. Вставь токен в переменную telegramBotToken в index.html.');
        }

        const chatIds = parseChatIds(post.chat_ids);

        if (!chatIds.length) {
          throw new Error('У поста нет chat_ids. Добавь хотя бы один Telegram chat id.');
        }

        const payloadText = buildTelegramText(post);
        const telegramChunks = splitTelegramMessage(payloadText);

        for (const chatId of chatIds) {
          for (let index = 0; index < telegramChunks.length; index += 1) {
            const chunk = telegramChunks[index];
            const isNotLast = index < telegramChunks.length - 1;
            const messageText = isNotLast ? `${chunk}\n\n...` : chunk;

            const htmlResult = await sendSingleTelegramChunk(chatId, messageText, true);

            if (!htmlResult.ok) {
              const fallbackText = stripTelegramHtml(messageText);
              if (!fallbackText) {
                throw new Error(`Не удалось отправить в чат ${chatId}: ${htmlResult.description}`);
              }

              const fallbackResult = await sendSingleTelegramChunk(chatId, fallbackText, false);
              if (!fallbackResult.ok) {
                throw new Error(`Не удалось отправить в чат ${chatId}: ${fallbackResult.description}`);
              }
            }
          }
        }
      }

      async function processDuePosts() {
        if (!supabaseClient) {
          return;
        }

        const nowIso = new Date().toISOString();
        const { data, error } = await supabaseClient
          .from('posts')
          .select('*')
          .lt('scheduled_at', nowIso)
          .in('status', ['pending', 'draft'])
          .order('scheduled_at', { ascending: true });

        if (error) {
          console.error('Ошибка проверки очереди:', error.message);
          return;
        }

        for (const post of data || []) {
          try {
            await sendTelegramMessage(post);

            const { error: updateError } = await supabaseClient
              .from('posts')
              .update({ status: 'sent', sent_at: new Date().toISOString() })
              .eq('id', post.id);

            if (updateError) {
              console.error('Ошибка обновления статуса:', updateError.message);
            }
          } catch (sendError) {
            console.error('Автоотправка не удалась:', sendError.message);
          }
        }

        await loadPosts();
      }

      function getMoscowOffsetMinutes(date) {
        const fmt = new Intl.DateTimeFormat('en-US', {
          timeZone: 'Europe/Moscow',
          timeZoneName: 'shortOffset',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false,
        });

        const tzName = fmt.formatToParts(date).find((part) => part.type === 'timeZoneName')?.value || 'GMT+3';
        const match = tzName.match(/GMT([+-])(\d{1,2})(?::?(\d{2}))?/i);

        if (!match) {
          return 180;
        }

        const sign = match[1] === '-' ? -1 : 1;
        const hours = Number(match[2] || 0);
        const minutes = Number(match[3] || 0);
        return sign * (hours * 60 + minutes);
      }

      function toMoscowIso(dateString, timeString) {
        if (!dateString || !timeString) {
          return null;
        }

        const [year, month, day] = dateString.split('-').map(Number);
        const [hours, minutes] = timeString.split(':').map(Number);
        const utcCandidate = Date.UTC(year, month - 1, day, hours, minutes, 0, 0);
        const offsetMinutes = getMoscowOffsetMinutes(new Date(utcCandidate));
        return new Date(utcCandidate - offsetMinutes * 60000).toISOString();
      }

      function formatMoscowDate(value) {
        if (!value) return 'Время не указано';
        return new Date(value).toLocaleString('ru-RU', {
          timeZone: 'Europe/Moscow',
          dateStyle: 'medium',
          timeStyle: 'short',
        });
      }

      function formatMoscowInputDate(value) {
        if (!value) return '';
        const date = new Date(value);
        return new Intl.DateTimeFormat('sv-SE', {
          timeZone: 'Europe/Moscow',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
        }).format(date).replace(/\-/g, '-');
      }

      function formatMoscowInputTime(value) {
        if (!value) return '';
        const date = new Date(value);
        return new Intl.DateTimeFormat('ru-RU', {
          timeZone: 'Europe/Moscow',
          hour: '2-digit',
          minute: '2-digit',
          hour12: false,
        }).format(date);
      }

      function showError(message) {
        alert(message);
      }

      function normalizeText(value) {
        return String(value || '').trim();
      }

      function shortenText(value, maxLength = 140) {
        const text = String(value || '').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
        if (!text) return 'Пустое содержимое';
        return text.length > maxLength ? `${text.slice(0, maxLength).trim()}...` : text;
      }

      function renderPosts(posts) {
        window.__postsCache = posts || [];
        postCount.textContent = posts.length + ' постов';

        if (!posts.length) {
          postsList.innerHTML = '<div class="empty-state">Пока нет постов. Создайте первый и поставьте его в очередь.</div>';
          return;
        }

        postsList.innerHTML = posts.map((post) => `
          <article class="post-card">
            <div class="post-head">
              <span class="chip">${post.type_name || 'Пост'}</span>
              <span class="status">${post.status || 'draft'}</span>
            </div>

            <h3>${post.title || 'Без заголовка'}</h3>
            <p class="subtitle">${post.subtitle || 'Без подзаголовка'}</p>
            <p class="meta">${post.scheduled_at ? formatMoscowDate(post.scheduled_at) : 'Время не указано'} · ${post.chat_ids || 'Чаты не указаны'}</p>
            <div class="preview">${shortenText(post.content, 160)}</div>

            <div class="actions">
              <button class="mini-button send" type="button" data-id="${post.id}" data-action="send">Отправить сейчас</button>
              <button class="mini-button" type="button" data-id="${post.id}" data-action="edit">Редактировать</button>
              <button class="mini-button delete" type="button" data-id="${post.id}" data-action="delete">Удалить</button>
            </div>
          </article>
        `).join('');

        document.querySelectorAll('[data-action]').forEach((button) => {
          button.addEventListener('click', async () => {
            const id = Number(button.dataset.id);
            const action = button.dataset.action;

            if (action === 'delete') {
              if (!supabaseClient) {
                showError('Supabase не подключён');
                return;
              }

              const { error } = await supabaseClient.from('posts').delete().eq('id', id);
              if (error) {
                showError('Ошибка удаления: ' + error.message);
                return;
              }
              await loadPosts();
            }

            if (action === 'send') {
              if (!supabaseClient) {
                showError('Supabase не подключён');
                return;
              }

              const { data: post, error: loadError } = await supabaseClient.from('posts').select('*').eq('id', id).single();
              if (loadError || !post) {
                showError('Не удалось найти пост для отправки');
                return;
              }

              try {
                await sendTelegramMessage(post);

                const { error: updateError } = await supabaseClient
                  .from('posts')
                  .update({ status: 'sent', sent_at: new Date().toISOString() })
                  .eq('id', id);

                if (updateError) {
                  showError('Сообщение отправлено, но не удалось обновить статус: ' + updateError.message);
                  return;
                }

                await loadPosts();
              } catch (sendError) {
                showError(sendError.message || 'Ошибка отправки в Telegram');
              }
            }

            if (action === 'edit') {
              openEditPostEditor(id);
            }
          });
        });
      }

      async function loadPosts() {
        if (!supabaseClient) {
          postsList.innerHTML = '<div class="empty-state">Supabase не подключён. Проверь URL и anon key.</div>';
          return;
        }

        const { data, error } = await supabaseClient.from('posts').select('*').order('scheduled_at', { ascending: true });

        if (error) {
          postsList.innerHTML = '<div class="empty-state">Ошибка загрузки из Supabase: ' + error.message + '</div>';
          return;
        }

        renderPosts(data || []);
      }

      document.getElementById('editor-form').addEventListener('submit', async function (event) {
        event.preventDefault();

        if (!supabaseClient) {
          showError('Supabase не подключён. Проверь URL и anon key.');
          return;
        }

        const type_name = normalizeText(document.getElementById('type_name').value);
        const title = normalizeText(document.getElementById('title').value);
        const subtitle = normalizeText(document.getElementById('subtitle').value);
        const content = normalizeText(document.getElementById('content').value);
        const chat_ids = normalizeText(document.getElementById('chat_ids').value);
        const send_date = normalizeText(document.getElementById('send_date').value);
        const send_time = normalizeText(document.getElementById('send_time').value);

        if (!type_name || !title || !content || !chat_ids) {
          showError('Заполните: тип поста, заголовок, содержимое и чаты.');
          return;
        }

        const payload = {
          type_name,
          title,
          subtitle,
          content,
          chat_ids,
          status: send_date || send_time ? 'pending' : 'draft',
          scheduled_at: send_date && send_time
            ? toMoscowIso(send_date, send_time)
            : send_date
              ? toMoscowIso(send_date, '09:00')
              : null
        };

        let error;

        if (currentEditingId) {
          const result = await supabaseClient.from('posts').update(payload).eq('id', currentEditingId);
          error = result.error;
        } else {
          const result = await supabaseClient.from('posts').insert([payload]);
          error = result.error;
        }

        if (error) {
          showError('Ошибка сохранения в Supabase: ' + error.message);
          return;
        }

        event.target.reset();
        currentEditingId = null;
        showListView();
        await loadPosts();
        await processDuePosts();
      });

      loadPosts();
      processDuePosts();
      setInterval(processDuePosts, 30000);
    </script>
  </body>
</html>
