<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NikitaNews Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #070d15;
        --bg-soft: #0d1723;
        --panel: rgba(20, 29, 39, 0.82);
        --panel-strong: rgba(15, 22, 30, 0.96);
        --line: rgba(169, 191, 218, 0.12);
        --text: #edf5ff;
        --muted: #aec5d8;
        --soft: #dfe9f6;
        --primary: #75b9ff;
        --primary-2: #8d78ff;
        --success: #5eead4;
        --warning: #fbbf24;
        --danger: #f87171;
        --shadow: 0 30px 70px rgba(0, 0, 0, 0.38);
      }

      * { box-sizing: border-box; }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Inter", sans-serif;
        background:
          radial-gradient(circle at 15% 20%, rgba(123, 117, 255, 0.18), transparent 20%),
          radial-gradient(circle at 75% 15%, rgba(110, 221, 175, 0.12), transparent 28%),
          radial-gradient(circle at 85% 78%, rgba(245, 162, 96, 0.12), transparent 26%),
          linear-gradient(180deg, #050b12 0%, var(--bg) 100%);
        color: var(--text);
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        border-radius: 50%;
        filter: blur(18px);
        opacity: 0.6;
        pointer-events: none;
      }

      body::before {
        width: 280px;
        height: 280px;
        right: 7%;
        bottom: 6%;
        background: rgba(126, 111, 91, 0.28);
        animation: drift 16s ease-in-out infinite alternate;
      }

      body::after {
        width: 260px;
        height: 260px;
        left: 6%;
        bottom: 8%;
        background: rgba(93, 143, 106, 0.18);
        animation: drift 18s ease-in-out infinite alternate-reverse;
      }

      @keyframes drift {
        0% { transform: translate3d(0, 0, 0) scale(1); }
        100% { transform: translate3d(30px, -18px, 0) scale(1.08); }
      }

      button, input, select, textarea {
        font: inherit;
      }

      .page-shell {
        max-width: 1380px;
        margin: 0 auto;
        padding: 28px 22px 54px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 22px;
      }

      .eyebrow {
        margin: 0 0 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: 11px;
        font-weight: 700;
        color: var(--primary);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 3vw, 3rem);
        letter-spacing: -0.04em;
      }

      .status-pill {
        min-width: 112px;
        text-align: center;
        padding: 10px 16px;
        border-radius: 999px;
        font-weight: 700;
        color: var(--soft);
        background: rgba(125, 158, 194, 0.08);
        border: 1px solid rgba(125, 158, 194, 0.22);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(360px, 1.1fr) minmax(350px, 0.9fr);
        gap: 26px;
      }

      .panel {
        background: linear-gradient(180deg, rgba(16, 25, 35, 0.92), rgba(10, 16, 23, 0.96));
        border: 1px solid var(--line);
        border-radius: 26px;
        box-shadow: var(--shadow);
        overflow: hidden;
        backdrop-filter: blur(12px);
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 22px 16px;
        border-bottom: 1px solid var(--line);
      }

      .panel-header h2 {
        margin: 0;
        font-size: 1.2rem;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 80px;
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .badge-info {
        background: rgba(117, 129, 255, 0.12);
        border: 1px solid rgba(117, 129, 255, 0.25);
        color: #d7d3ff;
      }

      .editor-form {
        display: grid;
        gap: 18px;
        padding: 20px 22px 26px;
      }

      .field-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      label {
        display: grid;
        gap: 8px;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .full-width {
        grid-column: 1 / -1;
      }

      input, select, textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(8, 13, 20, 0.86);
        color: var(--text);
        padding: 12px 14px;
        outline: none;
        transition: border-color 0.22s ease, box-shadow 0.22s ease, transform 0.22s ease;
      }

      input::placeholder, textarea::placeholder {
        color: rgba(187, 204, 222, 0.55);
      }

      input:focus, select:focus, textarea:focus {
        border-color: rgba(117, 185, 255, 0.7);
        box-shadow: 0 0 0 4px rgba(117, 185, 255, 0.12);
        transform: translateY(-1px);
      }

      textarea {
        min-height: 170px;
        resize: vertical;
      }

      .button-row {
        display: flex;
        justify-content: flex-start;
      }

      .primary-button {
        border: none;
        border-radius: 14px;
        padding: 13px 18px;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: white;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 18px 38px rgba(117, 185, 255, 0.25);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .primary-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 24px 42px rgba(117, 185, 255, 0.32);
      }

      .post-list {
        display: grid;
        gap: 16px;
        padding: 20px 22px 24px;
      }

      .post-card {
        position: relative;
        padding: 18px 18px 14px;
        border-radius: 18px;
        border: 1px solid var(--line);
        background: linear-gradient(180deg, rgba(18, 28, 38, 0.9), rgba(11, 18, 25, 0.96));
        overflow: hidden;
        animation: fadeUp 0.4s ease both;
      }

      .post-card::before {
        content: "";
        position: absolute;
        inset: 0 auto auto 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, var(--primary), transparent);
        opacity: 0.7;
      }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .post-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(117, 185, 255, 0.12);
        border: 1px solid rgba(117, 185, 255, 0.24);
        color: #dfeeff;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .status {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .post-card h3 {
        margin: 0 0 6px;
        font-size: 1.2rem;
      }

      .subtitle {
        margin: 0 0 10px;
        color: #dfeaf8;
      }

      .meta {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 0.86rem;
      }

      .preview {
        margin: 0;
        line-height: 1.65;
        color: #eef4ff;
        white-space: pre-wrap;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }

      .mini-button {
        border: 1px solid rgba(160, 178, 198, 0.2);
        background: rgba(148, 163, 184, 0.08);
        color: var(--text);
        border-radius: 10px;
        padding: 8px 10px;
        cursor: pointer;
        transition: transform 0.2s ease, border-color 0.2s ease;
      }

      .mini-button:hover {
        transform: translateY(-1px);
        border-color: rgba(160, 178, 198, 0.34);
      }

      .mini-button.send {
        background: rgba(94, 234, 212, 0.08);
        border-color: rgba(94, 234, 212, 0.2);
        color: #d8fff9;
      }

      .mini-button.delete {
        background: rgba(248, 113, 113, 0.08);
        border-color: rgba(248, 113, 113, 0.2);
        color: #ffd6d6;
      }

      .empty-state {
        border: 1px dashed rgba(154, 176, 202, 0.25);
        border-radius: 18px;
        padding: 28px 18px;
        text-align: center;
        color: var(--muted);
        background: rgba(11, 17, 25, 0.38);
      }

      @media (max-width: 1024px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 640px) {
        .field-grid {
          grid-template-columns: 1fr;
        }

        .topbar {
          flex-direction: column;
          align-items: flex-start;
          gap: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">NikitaNews</p>
          <h1>Редактор публикаций</h1>
        </div>
        <div class="status-pill" id="post-count">0 постов</div>
      </header>

      <main class="layout">
        <section class="panel editor-panel">
          <div class="panel-header">
            <h2>Создать пост</h2>
          </div>

          <form id="editor-form" class="editor-form">
            <div class="field-grid">
              <label>
                <span>Тип поста</span>
                <select id="type_name">
                  <option>Утренний</option>
                  <option>Вечерний</option>
                  <option>Итоги недели</option>
                  <option>Анонс</option>
                  <option>Новость</option>
                </select>
              </label>

              <label>
                <span>Дата отправки</span>
                <input id="send_date" type="date" />
              </label>

              <label>
                <span>Время отправки</span>
                <input id="send_time" type="time" />
              </label>

              <label class="full-width">
                <span>Чаты Telegram</span>
                <input id="chat_ids" type="text" placeholder="-1001234567890, -1009876543210" />
              </label>
            </div>

            <label>
              <span>Заголовок</span>
              <input id="title" type="text" placeholder="Например: Доброе утро, команда!" />
            </label>

            <label>
              <span>Подзаголовок</span>
              <input id="subtitle" type="text" placeholder="Краткое описание или лид" />
            </label>

            <label>
              <span>Содержимое</span>
              <textarea id="content" rows="8" placeholder="Текст поста..."></textarea>
            </label>

            <div class="button-row">
              <button type="submit" class="primary-button">Сохранить и поставить в очередь</button>
            </div>
          </form>
        </section>

        <section class="panel list-panel">
          <div class="panel-header">
            <h2>Посты</h2>
            <span class="badge badge-info">Очередь</span>
          </div>

          <div id="posts-list" class="post-list"></div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const supabaseUrl = 'https://kujrguralvgilvzpfqhw.supabase.co';
      const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1anJndXJhbHZnaWx2enBmcWh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNDM4MDUsImV4cCI6MjEwNTkxOTgwNX0.wLAeEzUonCDaZU0ZSAVq9VPAAIg71pWvMUFOvszyPKo';
      const supabaseClient = window.supabase ? window.supabase.createClient(supabaseUrl, supabaseKey) : null;

      const postsList = document.getElementById('posts-list');
      const postCount = document.getElementById('post-count');

      function showError(message) {
        alert(message);
      }

      function normalizeText(value) {
        return String(value || '').trim();
      }

      function renderPosts(posts) {
        postCount.textContent = posts.length + ' постов';

        if (!posts.length) {
          postsList.innerHTML = '<div class="empty-state">Пока нет постов. Создайте первый и поставьте его в очередь.</div>';
          return;
        }

        postsList.innerHTML = posts.map((post) => `
          <article class="post-card">
            <div class="post-head">
              <span class="chip">${post.type_name || 'Пост'}</span>
              <span class="status">${post.status || 'draft'}</span>
            </div>

            <h3>${post.title || 'Без заголовка'}</h3>
            <p class="subtitle">${post.subtitle || 'Без подзаголовка'}</p>
            <p class="meta">${post.scheduled_at ? new Date(post.scheduled_at).toLocaleString('ru-RU', { dateStyle: 'medium', timeStyle: 'short' }) : 'Время не указано'} · ${post.chat_ids || 'Чаты не указаны'}</p>
            <p class="preview">${post.content || 'Пустое содержимое'}</p>

            <div class="actions">
              <button class="mini-button send" type="button" data-id="${post.id}" data-action="send">Отправить сейчас</button>
              <button class="mini-button" type="button" data-id="${post.id}" data-action="edit">Редактировать</button>
              <button class="mini-button delete" type="button" data-id="${post.id}" data-action="delete">Удалить</button>
            </div>
          </article>
        `).join('');

        document.querySelectorAll('[data-action]').forEach((button) => {
          button.addEventListener('click', async () => {
            const id = Number(button.dataset.id);
            const action = button.dataset.action;

            if (action === 'delete') {
              if (!supabaseClient) {
                showError('Supabase не подключён');
                return;
              }

              const { error } = await supabaseClient.from('posts').delete().eq('id', id);
              if (error) {
                showError('Ошибка удаления: ' + error.message);
                return;
              }
              await loadPosts();
            }

            if (action === 'send') {
              if (!supabaseClient) {
                showError('Supabase не подключён');
                return;
              }

              const { error } = await supabaseClient.from('posts').update({ status: 'pending', scheduled_at: new Date().toISOString() }).eq('id', id);
              if (error) {
                showError('Ошибка отправки: ' + error.message);
                return;
              }
              await loadPosts();
            }

            if (action === 'edit') {
              if (!supabaseClient) {
                showError('Supabase не подключён');
                return;
              }

              const { data, error } = await supabaseClient.from('posts').select('*').eq('id', id).single();
              if (error || !data) {
                showError('Пост не найден');
                return;
              }

              document.getElementById('type_name').value = data.type_name || 'Утренний';
              document.getElementById('title').value = data.title || '';
              document.getElementById('subtitle').value = data.subtitle || '';
              document.getElementById('content').value = data.content || '';
              document.getElementById('chat_ids').value = data.chat_ids || '';

              if (data.scheduled_at) {
                const dt = new Date(data.scheduled_at);
                document.getElementById('send_date').value = dt.toISOString().slice(0, 10);
                document.getElementById('send_time').value = dt.toISOString().slice(11, 16);
              }
            }
          });
        });
      }

      async function loadPosts() {
        if (!supabaseClient) {
          postsList.innerHTML = '<div class="empty-state">Supabase не подключён. Проверь URL и anon key.</div>';
          return;
        }

        const { data, error } = await supabaseClient.from('posts').select('*').order('scheduled_at', { ascending: true });

        if (error) {
          postsList.innerHTML = '<div class="empty-state">Ошибка загрузки из Supabase: ' + error.message + '</div>';
          return;
        }

        renderPosts(data || []);
      }

      document.getElementById('editor-form').addEventListener('submit', async function (event) {
        event.preventDefault();

        if (!supabaseClient) {
          showError('Supabase не подключён. Проверь URL и anon key.');
          return;
        }

        const type_name = normalizeText(document.getElementById('type_name').value);
        const title = normalizeText(document.getElementById('title').value);
        const subtitle = normalizeText(document.getElementById('subtitle').value);
        const content = normalizeText(document.getElementById('content').value);
        const chat_ids = normalizeText(document.getElementById('chat_ids').value);
        const send_date = normalizeText(document.getElementById('send_date').value);
        const send_time = normalizeText(document.getElementById('send_time').value);

        if (!type_name || !title || !content || !chat_ids) {
          showError('Заполните: тип поста, заголовок, содержимое и чаты.');
          return;
        }

        const payload = {
          type_name,
          title,
          subtitle,
          content,
          chat_ids,
          status: send_date || send_time ? 'pending' : 'draft',
          scheduled_at: send_date && send_time
            ? new Date(`${send_date}T${send_time}`).toISOString()
            : send_date
              ? new Date(`${send_date}T09:00:00`).toISOString()
              : null
        };

        const { error } = await supabaseClient.from('posts').insert([payload]);

        if (error) {
          showError('Ошибка сохранения в Supabase: ' + error.message);
          return;
        }

        event.target.reset();
        await loadPosts();
      });

      loadPosts();
    </script>
  </body>
</html>
